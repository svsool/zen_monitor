name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - elixir-version: '1.18'
            otp-version: '25'
          - elixir-version: '1.19'
            otp-version: '26'
          - elixir-version: '1.20'
            otp-version: '27'
          - elixir-version: '1.20'
            otp-version: '28'
          - elixir-version: '1.20'
            otp-version: '29'
    steps:
    - uses: actions/checkout@v7
    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir-version }}
        otp-version: ${{ matrix.otp-version }}
    - name: Restore dependencies cache
      uses: actions/cache@v6
      with:
        path: deps
        key: ${{ runner.os }}-${{ matrix.elixir-version }}-${{ matrix.otp-version}}-mix-${{ hashFiles('**/mix.lock') }}
        restore-keys: ${{ runner.os }}-${{ matrix.elixir-version}}-${{ matrix.otp-version }}-mix-
    - name: Start EPMD
      run: epmd -daemon
    - name: Install dependencies
      run: mix deps.get
    - name: Run tests
      run: mix test
